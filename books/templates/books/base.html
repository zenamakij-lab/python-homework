<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Книжковий магазин{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="{% url 'books:list' %}">📚 Книжковий магазин</a>

        <div class="d-flex align-items-center gap-2">
            {% if perms.books.add_book %}
                <a class="btn btn-success" href="{% url 'books:create' %}">Додати книгу</a>
            {% endif %}

            {% if user.is_authenticated %}
                <a class="btn btn-outline-light" href="{% url 'users:profile' %}">Профіль</a>
                <form method="post" action="{% url 'users:logout' %}" class="d-inline">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-outline-light">Вийти</button>
                </form>
            {% else %}
                <a class="btn btn-outline-light" href="{% url 'users:login' %}">Увійти</a>
                <a class="btn btn-primary" href="{% url 'users:register' %}">Реєстрація</a>
            {% endif %}
        </div>
    </div>
</nav>

<div class="container">
    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show" role="alert">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
        {% endfor %}
    {% endif %}

    {% block content %}
    {% endblock %}
</div>
</body>
</html>
