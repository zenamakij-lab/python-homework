{% extends 'books/base.html' %}

{% block title %}{{ book.title }}{% endblock %}

{% block content %}

<h1>{{ book.title }}</h1>

<div class="card">
    <div class="card-body">

        <h5>Автор: {{ book.author }}</h5>

        <p>
            <strong>Категорія:</strong>
            {{ book.category }}
        </p>

        <p>
            <strong>Ціна:</strong>
            {{ book.price }} грн
        </p>

        <p>
            <strong>На складі:</strong>
            {{ book.stock }}
        </p>

        <hr>

        <p>
            {{ book.description }}
        </p>

        <a
            href="{% url 'books:update' book.pk %}"
            class="btn btn-warning"
        >
            Редагувати
        </a>

        <a
            href="{% url 'books:delete' book.pk %}"
            class="btn btn-danger"
        >
            Видалити
        </a>

        <a
            href="{% url 'books:list' %}"
            class="btn btn-secondary"
        >
            Назад
        </a>

    </div>
</div>

{% endblock %}
