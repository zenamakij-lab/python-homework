{% extends 'books/base.html' %}

{% block title %}Книга{% endblock %}

{% block content %}

<h1 class="mb-4">Книга</h1>

<form method="post">

    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit" class="btn btn-success">
        Зберегти
    </button>

    <a
        href="{% url 'books:list' %}"
        class="btn btn-secondary"
    >
        Скасувати
    </a>

</form>

{% endblock %}
